[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hobkg"
version = "0.1.0"
description = "Mechanistic knowledge-graph builder for MTG—The Hobbit (HOB). Phase 1: deterministic normalization."
requires-python = ">=3.11"
# Everything imported by a shipped package under src/. hobkg.network imports
# networkx; deckbench.table and deckbench.identity import numpy and pyarrow.
# Card 004's executor had to install pyarrow mid-run because it was declared in
# registry.md's Tech Stack but nowhere a clean checkout would find it.
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "networkx>=3",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
# Declared so the environment for benchmark phase 2 is reproducible, and kept
# out of the base install so a graph-only checkout stays light.
#
# xgboost is PINNED, not floored. It is the benchmark's fixed learner (section
# 8), and the fitted boosters are compared across target formulations in a
# single irreversible holdout read (card 017), so the learner must not move
# between the fits being compared. It moved once already: the T0 fits of cards
# 011 and 014 were made under a 3.4.1 Python wrapper and did not reproduce when
# refitted under 3.1.2 -- the grid search selected a different point. See the
# LABNOTEBOOK entry [2026-09-10 11:20]. Recording the version made that drift
# visible; this pin is what prevents it. Changing this pin invalidates every
# fitted artifact under data/runs/ and must be a deliberate, recorded decision.
modeling = ["pandas>=2", "scikit-learn>=1.4", "xgboost==3.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
